<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        /* TestingBot brand: primary-600 from testingbot.com */
        --tb-blue: #2563eb;
        --tb-blue-strong: #1d4ed8;
        --tb-accent: light-dark(#2563eb, #60a5fa);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        font-size: var(--font-text-md-size, 14px);
        background: var(--color-background-primary, transparent);
        color: var(--color-text-primary, CanvasText);
      }
      .tb-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 9px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
      }
      .tb-brand svg {
        height: 22px;
        width: auto;
        flex: 0 0 auto;
      }
      /* Keep the logo's dark outline visible on dark hosts. */
      :root[data-theme="dark"] .tb-brand svg {
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.45));
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .tb-brand svg {
          filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.45));
        }
      }
      .tb-wordmark {
        font-size: var(--font-text-sm-size, 13px);
        font-weight: var(--font-weight-semibold, 600);
        letter-spacing: 0.01em;
      }
      .tb-wordmark b {
        color: var(--tb-accent);
        font-weight: var(--font-weight-bold, 700);
      }
      button:focus-visible,
      img:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--tb-accent);
        outline-offset: 1px;
      }
      .loading,
      .error {
        padding: 10px 12px;
        border-radius: var(--border-radius-md, 8px);
      }
      .error {
        background: var(--color-background-danger, rgba(220, 53, 69, 0.12));
        color: var(--color-text-danger, #c0392b);
        white-space: pre-wrap;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .header h1 {
        font-size: var(--font-heading-sm-size, 16px);
        font-weight: var(--font-weight-semibold, 600);
        margin: 0;
        overflow-wrap: anywhere;
      }
      .pill {
        padding: 2px 10px;
        border-radius: var(--border-radius-full, 999px);
        font-size: var(--font-text-xs-size, 12px);
        font-weight: var(--font-weight-semibold, 600);
        white-space: nowrap;
      }
      .pill.pass {
        background: var(--color-background-success, rgba(40, 167, 69, 0.15));
        color: var(--color-text-success, #1e7e34);
      }
      .pill.fail {
        background: var(--color-background-danger, rgba(220, 53, 69, 0.15));
        color: var(--color-text-danger, #c0392b);
      }
      .pill.unknown {
        background: var(--color-background-tertiary, rgba(128, 128, 128, 0.15));
        color: var(--color-text-secondary, inherit);
      }
      .status-message {
        margin: 0 0 10px;
        color: var(--color-text-secondary, inherit);
        overflow-wrap: anywhere;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .chip {
        padding: 3px 9px;
        border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
        border-radius: var(--border-radius-full, 999px);
        font-size: var(--font-text-xs-size, 12px);
        color: var(--color-text-secondary, inherit);
        white-space: nowrap;
      }
      video {
        width: 100%;
        max-height: 340px;
        border-radius: var(--border-radius-md, 8px);
        background: #000;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: var(--font-text-sm-size, 13px);
        font-weight: var(--font-weight-semibold, 600);
        margin: 12px 0 6px;
      }
      .thumbs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 8px;
      }
      .thumbs img {
        height: 84px;
        border-radius: var(--border-radius-sm, 6px);
        border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
        cursor: pointer;
        flex: 0 0 auto;
      }
      .thumbs img:hover {
        border-color: var(--tb-accent);
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 4px;
      }
      button.link {
        padding: 5px 12px;
        border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
        border-radius: var(--border-radius-md, 8px);
        background: var(--color-background-secondary, transparent);
        color: var(--color-text-primary, inherit);
        font: inherit;
        font-size: var(--font-text-sm-size, 13px);
        cursor: pointer;
      }
      button.link:hover {
        background: var(--color-background-tertiary, rgba(128, 128, 128, 0.12));
        border-color: var(--tb-accent);
      }
      button.link.primary {
        background: var(--tb-blue);
        border-color: var(--tb-blue);
        color: #fff;
        font-weight: var(--font-weight-medium, 500);
      }
      button.link.primary:hover {
        background: var(--tb-blue-strong);
        border-color: var(--tb-blue-strong);
      }
      details {
        margin-top: 10px;
      }
      details summary {
        cursor: pointer;
        font-size: var(--font-text-sm-size, 13px);
        font-weight: var(--font-weight-medium, 500);
        color: var(--tb-accent);
      }
      .step {
        padding: 6px 8px;
        border-left: 2px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
        margin: 6px 0;
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: var(--font-text-xs-size, 12px);
        overflow-wrap: anywhere;
      }
      .step .cmd {
        font-weight: var(--font-weight-semibold, 600);
      }
      .step .sub {
        color: var(--color-text-secondary, inherit);
      }
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
        z-index: 10;
      }
      .lightbox img {
        max-width: 94%;
        max-height: 94%;
        border-radius: var(--border-radius-md, 8px);
      }
    </style>
  </head>
  <body>
    <header class="tb-brand"><!--__TB_LOGO__--><span class="tb-wordmark">Testing<b>Bot</b></span></header>
    <div id="root"><p class="loading">Waiting for test data…</p></div>
    <script type="module">/*__VIEW_BUNDLE__*/</script>
  </body>
</html>
