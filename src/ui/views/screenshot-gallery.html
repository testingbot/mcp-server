<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        /* TestingBot brand: primary-600 from testingbot.com */
        --tb-blue: #2563eb;
        --tb-blue-strong: #1d4ed8;
        --tb-accent: light-dark(#2563eb, #60a5fa);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        font-size: var(--font-text-md-size, 14px);
        background: var(--color-background-primary, transparent);
        color: var(--color-text-primary, CanvasText);
      }
      .tb-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 9px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
      }
      .tb-brand svg {
        height: 22px;
        width: auto;
        flex: 0 0 auto;
      }
      /* Keep the logo's dark outline visible on dark hosts. */
      :root[data-theme="dark"] .tb-brand svg {
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.45));
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .tb-brand svg {
          filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.45));
        }
      }
      .tb-wordmark {
        font-size: var(--font-text-sm-size, 13px);
        font-weight: var(--font-weight-semibold, 600);
        letter-spacing: 0.01em;
      }
      .tb-wordmark b {
        color: var(--tb-accent);
        font-weight: var(--font-weight-bold, 700);
      }
      button:focus-visible,
      img:focus-visible {
        outline: 2px solid var(--tb-accent);
        outline-offset: 1px;
      }
      .loading,
      .error,
      .processing {
        padding: 10px 12px;
        border-radius: var(--border-radius-md, 8px);
      }
      .error {
        background: var(--color-background-danger, rgba(220, 53, 69, 0.12));
        color: var(--color-text-danger, #c0392b);
        white-space: pre-wrap;
      }
      .processing {
        background: var(--color-background-info, rgba(37, 99, 235, 0.08));
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .spinner {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        border: 2px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
        border-top-color: var(--tb-blue);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .header h1 {
        font-size: var(--font-heading-sm-size, 16px);
        font-weight: var(--font-weight-semibold, 600);
        margin: 0;
        overflow-wrap: anywhere;
      }
      .header .count {
        color: var(--color-text-secondary, inherit);
        font-size: var(--font-text-sm-size, 13px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 12px;
      }
      .card {
        border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
        border-radius: var(--border-radius-md, 8px);
        overflow: hidden;
        background: var(--color-background-secondary, transparent);
      }
      .card:hover {
        border-color: var(--tb-accent);
      }
      .card img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        object-position: top;
        cursor: zoom-in;
        background: var(--color-background-tertiary, rgba(128, 128, 128, 0.12));
      }
      .card .label {
        padding: 7px 9px;
        font-size: var(--font-text-xs-size, 12px);
        color: var(--color-text-secondary, inherit);
        overflow-wrap: anywhere;
      }
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: zoom-out;
        z-index: 10;
      }
      .lightbox img {
        max-width: 94%;
        max-height: 86%;
        border-radius: var(--border-radius-md, 8px);
      }
      .lightbox button {
        padding: 6px 14px;
        border: none;
        border-radius: var(--border-radius-md, 8px);
        background: var(--tb-blue);
        color: #fff;
        font: inherit;
        font-size: var(--font-text-sm-size, 13px);
        cursor: pointer;
      }
      .lightbox button:hover {
        background: var(--tb-blue-strong);
      }
    </style>
  </head>
  <body>
    <header class="tb-brand"><!--__TB_LOGO__--><span class="tb-wordmark">Testing<b>Bot</b></span></header>
    <div id="root"><p class="loading">Waiting for screenshots…</p></div>
    <script type="module">/*__VIEW_BUNDLE__*/</script>
  </body>
</html>
